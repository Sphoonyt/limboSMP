name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project
        id: proj
        run: |
          echo "Repo root contents:"
          ls -la
          S=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "./.git/*" | head -1)
          if [ -z "$S" ]; then
            echo "::error::No settings.gradle(.kts) found. The plugin project files are not in this repo (did you push the zip instead of its contents?)"
            exit 1
          fi
          echo "Found: $S"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle clean build --console=plain

      - name: Show jars
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: LimboSMP
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error

      - name: Zip resource pack
        working-directory: ${{ steps.proj.outputs.dir }}/resourcepack
        run: zip -r ../LimboSMP-ResourcePack.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: LimboSMP-ResourcePack
          path: ${{ steps.proj.outputs.dir }}/LimboSMP-ResourcePack.zip
          if-no-files-found: error
